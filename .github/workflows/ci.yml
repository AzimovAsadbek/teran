# Continuous integration: formatting, lint, types, unit, integration and end-to-end tests, the
# production images and a dependency audit. It never deploys and holds no deployment secrets.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
  NEXT_TELEMETRY_DISABLED: '1'
  CHECKPOINT_DISABLE: '1'

jobs:
  quality:
    name: Format, lint, types and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm generate
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  integration:
    name: API integration tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_USER: teran
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: teran_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teran -d teran_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://teran:ci-only-password@127.0.0.1:5432/teran_test?schema=public
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      # Films from iPhones are made into MP4s with ffmpeg (ADR-062); its suite needs it in CI.
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ffmpeg
      - run: pnpm generate
      - run: pnpm test:integration

  e2e:
    name: End-to-end tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_USER: teran
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: teran_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U teran -d teran_e2e"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      E2E_DATABASE_URL: postgresql://teran:ci-only-password@127.0.0.1:5432/teran_e2e?schema=public
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - name: Build the end-to-end stack
        run: pnpm --filter @teran/e2e build:stack
      - name: Install Chromium
        run: pnpm --filter @teran/e2e exec playwright install --with-deps chromium
      # The stack's API makes posted iPhone films into MP4s with ffmpeg (ADR-062).
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ffmpeg
      - run: pnpm test:e2e
      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  images:
    name: Production images
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate the Compose file
        env:
          PUBLIC_ORIGIN: https://ci.invalid
          POSTGRES_PASSWORD: ci-only
          APP_SECRET: ci-only
          INTERNAL_API_KEY: ci-only
          REVALIDATE_SECRET: ci-only
          TERAN_WEB_HOST_PORT: '4030'
          TERAN_API_HOST_PORT: '4031'
        run: docker compose -f docker-compose.prod.yml --env-file /dev/null config --quiet
      - name: Check the deploy script
        run: |
          bash -n deploy.sh
          shellcheck deploy.sh
          ./deploy.sh --help > /dev/null
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the API image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          target: runtime
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
      - name: Build the migration and tools image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          target: tools
          push: false
          cache-from: type=gha,scope=api
      - name: Build the web image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://ci.invalid
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Known vulnerabilities in production dependencies (high and critical)
        run: pnpm audit:prod
