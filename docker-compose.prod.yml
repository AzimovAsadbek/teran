# Production stack: PostgreSQL, a one-off migration job, the API, the storefront and Caddy.
# Only Caddy publishes ports; the database is on an internal network without internet access.
#
#   cp docker/production.env.example .env.production   # fill in, then chmod 600
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#
# Read docs/deployment/production.md before the first deployment.
name: teran-production

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-database-url: &database-url postgresql://${POSTGRES_USER:-teran}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-teran}?schema=public

services:
  postgres:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-teran}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-teran}
    volumes:
      - postgres-data:/var/lib/postgresql
    shm_size: 256mb
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]
    logging: *logging

  # Applies pending migrations, then exits. Every `up` runs it again before the API starts.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: tools
    image: teran-api-tools:${TERAN_VERSION:-latest}
    restart: 'no'
    environment:
      DATABASE_URL: *database-url
    volumes:
      # Only used when loading the demonstration catalogue (see the deployment guide).
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks: [data]
    logging: *logging
    <<: *hardening

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    image: teran-api:${TERAN_VERSION:-latest}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: *database-url
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      WEB_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN, e.g. https://teran.example}
      CORS_EXTRA_ORIGINS: ${CORS_EXTRA_ORIGINS:-}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY}
      COOKIE_SECURE: 'true'
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-5242880}
      WEB_REVALIDATE_URL: http://web:3000/api/revalidate
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?Set REVALIDATE_SECRET}
      SWAGGER_ENABLED: 'false'
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-disabled}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      PAYMENT_METHODS_ENABLED: ${PAYMENT_METHODS_ENABLED:-CASH_ON_DELIVERY}
      PAYMENT_PROVIDER_MODE: ${PAYMENT_PROVIDER_MODE:-live}
      ALLOW_DEMO_PAYMENTS: ${ALLOW_DEMO_PAYMENTS:-false}
      ONLINE_PAYMENT_WINDOW_MINUTES: ${ONLINE_PAYMENT_WINDOW_MINUTES:-30}
      PAYME_MERCHANT_ID: ${PAYME_MERCHANT_ID:-}
      PAYME_KEY: ${PAYME_KEY:-}
      PAYME_CHECKOUT_URL: ${PAYME_CHECKOUT_URL:-https://checkout.paycom.uz}
      CLICK_SERVICE_ID: ${CLICK_SERVICE_ID:-}
      CLICK_MERCHANT_ID: ${CLICK_MERCHANT_ID:-}
      CLICK_SECRET_KEY: ${CLICK_SECRET_KEY:-}
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [data, app]
    logging: *logging
    <<: *hardening

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_INTERNAL_URL: http://api:4000
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN, e.g. https://teran.example}
        NEXT_PUBLIC_ENABLED_LOCALES: ${ENABLED_LOCALES:-uz,ru,en}
        NEXT_PUBLIC_DEMO_CONTENT: ${DEMO_CONTENT:-true}
    image: teran-web:${TERAN_VERSION:-latest}
    restart: unless-stopped
    init: true
    environment:
      API_INTERNAL_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?Set REVALIDATE_SECRET}
    depends_on:
      api:
        condition: service_healthy
    networks: [app]
    logging: *logging
    <<: *hardening

  caddy:
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    ports:
      - '${HTTP_PORT:-80}:80'
      - '${HTTPS_PORT:-443}:443'
      - '${HTTPS_PORT:-443}:443/udp'
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?Set SITE_ADDRESS, e.g. teran.example}
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
    networks: [app]
    logging: *logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

networks:
  # PostgreSQL, the migration job and the API. Internal: no route to or from the internet.
  data:
    internal: true
  # Caddy, the storefront and the API.
  app: {}

volumes:
  postgres-data:
  uploads:
  caddy-data:
  caddy-config:
