# Production stack: PostgreSQL, a one-off migration job, the API and the storefront. The server's
# own Nginx (configured by its administrator, never by this repository) terminates HTTPS and
# proxies to the storefront and the API, which are published on the loopback interface only, at
# the host ports deploy.sh saves in .deploy.env. The database is on an internal network without
# internet access and is never published.
#
#   cp docker/production.env.example .env.production   # fill in, then chmod 600
#   ./deploy.sh                                        # first installation, then every update
#
# Manual commands need both env files:
#   docker compose -p teran-production -f docker-compose.prod.yml \
#     --env-file .env.production --env-file .deploy.env ps
#
# Read docs/deployment/production.md before the first deployment.
name: teran-production

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '5'

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

x-database-url: &database-url postgresql://${POSTGRES_USER:-teran}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-teran}?schema=public

# Cloudflare R2 (ADR-043): set all five in .env.production to keep pictures and films in the bucket,
# or none to keep them in the `uploads` volume.
x-object-storage: &object-storage
  R2_ENDPOINT: ${R2_ENDPOINT:-}
  R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
  R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
  R2_BUCKET: ${R2_BUCKET:-}
  R2_PUBLIC_URL: ${R2_PUBLIC_URL:-}

services:
  postgres:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-teran}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-teran}
    volumes:
      - postgres-data:/var/lib/postgresql
    shm_size: 256mb
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [data]
    logging: *logging

  # Applies pending migrations, then exits. Every `up` runs it again before the API starts. The
  # same image runs the one-off scripts (demo seed on a staging copy, large gallery films), which
  # write to the store the API uses and so reach R2 through the `app` network.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: tools
    image: teran-api-tools:${TERAN_VERSION:-latest}
    restart: 'no'
    environment:
      DATABASE_URL: *database-url
      <<: *object-storage
      # The seed refreshes the storefront's cache afterwards, as the API does after a change.
      WEB_REVALIDATE_URL: http://web:3000/api/revalidate
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?Set REVALIDATE_SECRET}
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks: [data, app]
    logging: *logging
    <<: *hardening

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: runtime
    image: teran-api:${TERAN_VERSION:-latest}
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    # For the server's Nginx only: loopback, never the public interface. The host port is chosen
    # once by deploy.sh and kept in .deploy.env; the API listens on 4000 inside the container.
    ports:
      - '127.0.0.1:${TERAN_API_HOST_PORT:?Set TERAN_API_HOST_PORT (deploy.sh keeps it in .deploy.env)}:4000'
    environment:
      <<: *object-storage
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: *database-url
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      WEB_ORIGIN: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN, e.g. https://teran.example}
      CORS_EXTRA_ORIGINS: ${CORS_EXTRA_ORIGINS:-}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY}
      COOKIE_SECURE: 'true'
      UPLOAD_MAX_BYTES: ${UPLOAD_MAX_BYTES:-5242880}
      WEB_REVALIDATE_URL: http://web:3000/api/revalidate
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?Set REVALIDATE_SECRET}
      SWAGGER_ENABLED: 'false'
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-disabled}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      # Online ordering; must match SHOW_PRICES (a storefront without prices takes no orders).
      CHECKOUT_ENABLED: ${CHECKOUT_ENABLED:-false}
      PAYMENT_METHODS_ENABLED: ${PAYMENT_METHODS_ENABLED:-CASH_ON_DELIVERY}
      PAYMENT_PROVIDER_MODE: ${PAYMENT_PROVIDER_MODE:-live}
      ALLOW_DEMO_PAYMENTS: ${ALLOW_DEMO_PAYMENTS:-false}
      ONLINE_PAYMENT_WINDOW_MINUTES: ${ONLINE_PAYMENT_WINDOW_MINUTES:-30}
      PAYME_MERCHANT_ID: ${PAYME_MERCHANT_ID:-}
      PAYME_KEY: ${PAYME_KEY:-}
      PAYME_LOGIN: ${PAYME_LOGIN:-Paycom}
      PAYME_CHECKOUT_URL: ${PAYME_CHECKOUT_URL:-https://checkout.paycom.uz}
      PAYME_CHECK_IP: ${PAYME_CHECK_IP:-true}
      CLICK_SERVICE_ID: ${CLICK_SERVICE_ID:-}
      CLICK_MERCHANT_ID: ${CLICK_MERCHANT_ID:-}
      CLICK_SECRET_KEY: ${CLICK_SECRET_KEY:-}
      TELEGRAM_MODE: ${TELEGRAM_MODE:-disabled}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHANNEL_ID: ${TELEGRAM_CHANNEL_ID:-}
      TELEGRAM_POST_LOCALE: ${TELEGRAM_POST_LOCALE:-uz}
      # The chat's AI assistant (ADR-055): no key, no assistant.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      ASSISTANT_DAILY_LIMIT: ${ASSISTANT_DAILY_LIMIT:-2000}
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks: [data, app]
    logging: *logging
    <<: *hardening

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_INTERNAL_URL: http://api:4000
        NEXT_PUBLIC_SITE_URL: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN, e.g. https://teran.example}
        NEXT_PUBLIC_ENABLED_LOCALES: ${ENABLED_LOCALES:-uz,ru,en}
        NEXT_PUBLIC_DEMO_CONTENT: ${DEMO_CONTENT:-true}
        NEXT_PUBLIC_SHOW_PRICES: ${SHOW_PRICES:-false}
        # The bucket's public address, allowed in the content security policy for pictures and films.
        UPLOADS_ORIGIN: ${R2_PUBLIC_URL:-}
    image: teran-web:${TERAN_VERSION:-latest}
    restart: unless-stopped
    init: true
    # For the server's Nginx only: loopback, never the public interface. The host port is chosen
    # once by deploy.sh and kept in .deploy.env; Next.js listens on 3000 inside the container.
    ports:
      - '127.0.0.1:${TERAN_WEB_HOST_PORT:?Set TERAN_WEB_HOST_PORT (deploy.sh keeps it in .deploy.env)}:3000'
    environment:
      API_INTERNAL_KEY: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET:?Set REVALIDATE_SECRET}
    depends_on:
      api:
        condition: service_healthy
    networks: [app]
    logging: *logging
    <<: *hardening

networks:
  # PostgreSQL, the migration job and the API. Internal: no route to or from the internet.
  data:
    internal: true
  # The storefront, the API and the migration job; the published loopback ports are on it.
  app: {}

volumes:
  postgres-data:
  uploads:
