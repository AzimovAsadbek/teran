# Local development infrastructure.
# PostgreSQL is bound to 127.0.0.1 only, so it is never reachable from other machines.
name: teran

services:
  postgres:
    image: postgres:18.6-alpine3.24
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-teran}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-teran_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-teran}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5434}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  postgres-data:
